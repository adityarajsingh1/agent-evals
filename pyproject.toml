[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evals"
version = "0.1.0"
description = "Regression tests for AI agents: answers, tool use, hallucinations and cost, checked in CI."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aditya Raj Singh" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15", "mypy>=1.10", "pre-commit>=3.5"]

[project.urls]
Repository = "https://github.com/adityarajsingh1/agent-evals"

[tool.setuptools.packages.find]
include = ["agent_evals*"]

[tool.setuptools.package-data]
agent_evals = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
